global:
  namespace: production
  environment: production

backend:
  replicas: 3
  image:
    repository: devops-portfolio-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 5000
  env:
    APP_ENV: production
    APP_VERSION: "1.0.0"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

frontend:
  replicas: 2
  image:
    repository: devops-portfolio-frontend
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  credentials:
    database: notesdb_prod
    user: postgres
    password: "PRODUCTION-PLACEHOLDER-CHANGE-ME"
  storage:
    size: 5Gi

ingress:
  enabled: true
  className: traefik
  host: devops-portfolio.com
  annotations: {}
