global:
  namespace: staging
  environment: staging
backend:
  replicas: 1
  image:
    repository: devops-portfolio-backend
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 5000
  env:
    APP_ENV: staging
    APP_VERSION: 1.0.0
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  autoscaling:
    enabled: false
frontend:
  replicas: 1
  image:
    repository: devops-portfolio-frontend
    tag: 1.0.2
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m
postgres:
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  credentials:
    database: notesdb_staging
    user: postgres
    password: STAGING-PLACEHOLDER-CHANGE-ME
  storage:
    size: 1Gi
ingress:
  enabled: true
  className: traefik
  host: staging.devops-portfolio.local
  annotations: {}
