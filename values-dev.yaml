global:
  environment: development

backend:
  replicas: 1
  image:
    repository: devops-portfolio-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

frontend:
  replicas: 1
  image:
    repository: devops-portfolio-frontend
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"

postgres:
  credentials:
    password: "demo-no-usar-en-produccion"

ingress:
  host: devops-portfolio.dev
